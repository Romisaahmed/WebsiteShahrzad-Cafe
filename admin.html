<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shahrzad - Bookings</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-header">
    <h1>
        SHAHRZAD
        <span>Admin</span>
    </h1>

    <span>
        <i class="fas fa-calendar-check"></i>
        Bookings
    </span>
</div>

<div class="admin-body">

    <div class="stats">

        <div class="stat-card">
            <div class="num" id="totalCount">0</div>
            <div class="lbl">Total Bookings</div>
        </div>

        <div class="stat-card">
            <div class="num" id="todayCount">0</div>
            <div class="lbl">Today's Bookings</div>
        </div>

        <div class="stat-card">
            <div class="num" id="roomCount">0</div>
            <div class="lbl">Rooms Booked</div>
        </div>

    </div>

    <div class="bookings">

        <div class="bookings-title">
            <h2>
                <i class="fas fa-calendar-check"></i>
                Bookings
            </h2>

            <button class="clear-btn" onclick="clearAll()">
                <i class="fas fa-trash"></i>
                Clear All
            </button>
        </div>

        <div id="tableContainer">
            <div class="empty">
                <i class="fas fa-inbox"></i>
                No bookings yet.
            </div>
        </div>

    </div>

</div>

<script>
function loadBookings() {
    const bookings = JSON.parse(
        localStorage.getItem('shahrzad_bookings') || '[]'
    );

    const today = new Date().toISOString().split('T')[0];

    document.getElementById('totalCount').textContent = bookings.length;

    document.getElementById('todayCount').textContent =
        bookings.filter(function(booking) {
            return booking.date === today;
        }).length;

    const rooms = new Set(
        bookings.map(function(booking) {
            return booking.roomName;
        })
    );

    document.getElementById('roomCount').textContent = rooms.size;

    const container = document.getElementById('tableContainer');

    if (bookings.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <i class="fas fa-inbox"></i>
                No bookings yet.
            </div>
        `;
        return;
    }

    let rows = '';

    bookings.slice().reverse().forEach(function(booking, index) {
        rows += `
            <tr>
                <td>${bookings.length - index}</td>
                <td>${booking.name || '-'}</td>
                <td>${booking.phone || '-'}</td>
                <td><span class="badge">${booking.roomName || '-'}</span></td>
                <td>${booking.date || '-'}</td>
                <td>${booking.time || '-'}</td>
                <td>${booking.hours ? booking.hours + 'h' : '-'}</td>
            </tr>
        `;
    });

    container.innerHTML = `
        <table>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Room</th>
                <th>Date</th>
                <th>Time</th>
                <th>Duration</th>
            </tr>
            ${rows}
        </table>
    `;
}

function clearAll() {
    if (confirm('Delete all bookings?')) {
        localStorage.removeItem('shahrzad_bookings');
        loadBookings();
    }
}

loadBookings();
</script>

</body>
</html>
